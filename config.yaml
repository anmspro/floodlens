# FloodLens configuration. Paths are relative to the repo root.

dataset:
  hf_base_url: "https://huggingface.co/datasets/jennifer-fowler/UTSA-flood-images/resolve/main"
  dir: "data/raw/Texas_Flood_Student_Data"

events:
  harvey:
    name: "Hurricane Harvey"
    before_label: "2016 (USDA NAIP)"
    window: ["2017-08-25", "2017-09-06"]
    nws_offices: ["HGX", "LCH"]
  guadalupe_2025:
    name: "Guadalupe River flood, July 2025"
    before_label: null
    window: ["2025-07-03", "2025-07-23"]
    nws_offices: ["EWX"]
  san_antonio_crossings:
    name: "Heavy-rain scenario: every low-water crossing floods"
    before_label: null
    window: ["2025-06-11", "2025-06-13"]   # NWS warnings of the deadly 12 June 2025 San Antonio flash flood, as context
    nws_offices: ["EWX"]

# Every area the organizer dataset covers. Tiles are selected by `locality`.
# mode: pair = before/after pairs, after_only = no before image exists.
default_area: "west_houston"
areas:
  west_houston:
    name: "West Houston: Addicks and Barker"
    event: harvey
    mode: pair
    localities: ["West Houston / Addicks and Barker", "Bear Creek / west Houston", "Eldridge / northwest Houston"]
  richmond:
    name: "Richmond and Rosenberg (Brazos River)"
    event: harvey
    mode: pair
    localities: ["Richmond / Rosenberg / Brazos"]
  kingwood:
    name: "Kingwood and Forest Cove (San Jacinto River)"
    event: harvey
    mode: pair
    localities: ["Forest Cove / Kingwood", "Kingwood / northeast Houston"]
  bevil_oaks:
    name: "Bevil Oaks (Pine Island Bayou)"
    event: harvey
    mode: pair
    localities: ["Bevil Oaks / Pine Island Bayou"]
  simonton:
    name: "Simonton (Brazos River)"
    event: harvey
    mode: pair
    localities: ["Simonton / Brazos"]
  hill_country:
    name: "Texas Hill Country (Guadalupe River)"
    event: guadalupe_2025
    mode: after_only
    localities: ["Hunt / Guadalupe River", "Ingram / Guadalupe River", "Kerrville / Guadalupe River",
                 "Center Point / Guadalupe River", "Comfort / Guadalupe River"]

  san_antonio:
    name: "San Antonio: low-water crossings (scenario)"
    event: san_antonio_crossings
    mode: scenario
    localities: []

imagery:
  tile_format: "webp"     # web map tiles cut from the GeoTIFFs
  min_zoom: 12

osm:
  coverage_buffer_m: 150  # fetch roads this far beyond the photographed area

roads:
  max_segment_m: 100
  split_if_longer_than_m: 120
  chip_buffer_m: 20
  chip_min_side_m: 80
  chip_px: 448
  min_valid_fraction: 0.5

vlm:
  model: "qwen3-vl-8b-instruct"
  # jury = pair question (roads_v2) + after-only surface question (surface_v1);
  # any "water" answer makes the road blocked. after_only areas use surface_v1 alone.
  method: "jury"

thresholds:
  road:
    blocked_min_conf: 0.6
    open_min_conf: 0.6

routing:
  uncertain_penalty: 4.0

cutoff:
  min_buildings: 3

population:
  persons_per_building: 2.5
