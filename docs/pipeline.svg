<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 330" font-family="-apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="13">
  <rect width="980" height="330" fill="#ffffff"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5a6a75"/></marker>
    <style>
      .b{fill:#f4f7f9;stroke:#c9d3d9;stroke-width:1.2;rx:8}
      .m{fill:#e8f1fb;stroke:#1e64c8;stroke-width:1.4;rx:8}
      .o{fill:#eaf6ee;stroke:#1f9d55;stroke-width:1.2;rx:8}
      .t{fill:#12202a;font-weight:600}
      .s{fill:#5a6a75;font-size:11.5px}
      .l{stroke:#5a6a75;stroke-width:1.4;fill:none;marker-end:url(#a)}
    </style>
  </defs>
  <!-- inputs -->
  <rect class="b" x="20" y="30" width="180" height="56"/><text class="t" x="34" y="53">Before/after photos</text><text class="s" x="34" y="72">GeoTIFF, web tiles</text>
  <rect class="b" x="20" y="110" width="180" height="56"/><text class="t" x="34" y="133">OpenStreetMap</text><text class="s" x="34" y="152">roads ≤100 m, buildings, exits</text>
  <rect class="b" x="20" y="190" width="180" height="56"/><text class="t" x="34" y="213">Context sources</text><text class="s" x="34" y="232">SVI, NWS, gauges, NFIP, DEM</text>
  <!-- crops -->
  <rect class="b" x="240" y="70" width="170" height="56"/><text class="t" x="254" y="93">Before/after crops</text><text class="s" x="254" y="112">road drawn in magenta</text>
  <!-- model -->
  <rect class="m" x="450" y="58" width="190" height="80"/><text class="t" x="464" y="82">Vision-language model</text><text class="s" x="464" y="101">1. new water vs before?</text><text class="s" x="464" y="118">2. what covers the road?</text><text class="s" x="464" y="132" font-style="italic">any water = blocked</text>
  <!-- graph -->
  <rect class="b" x="450" y="170" width="190" height="56"/><text class="t" x="464" y="193">Street graph</text><text class="s" x="464" y="212">open · blocked · uncertain</text>
  <!-- outputs -->
  <rect class="o" x="690" y="20" width="270" height="44"/><text class="t" x="704" y="47">Cut-off neighbourhoods, ranked by SVI</text>
  <rect class="o" x="690" y="74" width="270" height="44"/><text class="t" x="704" y="101">Safe route vs shortest route</text>
  <rect class="o" x="690" y="128" width="270" height="44"/><text class="t" x="704" y="155">Relief sites (max coverage)</text>
  <rect class="o" x="690" y="182" width="270" height="44"/><text class="t" x="704" y="209">Economic impact (NFIP-calibrated)</text>
  <rect class="m" x="690" y="236" width="270" height="44"/><text class="t" x="704" y="263">Dispatch brief + alert (EN/ES), checked</text>
  <!-- delivery -->
  <rect class="b" x="240" y="270" width="400" height="40"/><text class="t" x="254" y="295">Web app · HTTP API · MCP server · offline snapshots</text>
  <!-- arrows -->
  <path class="l" d="M200 58 H220 V98 H238"/>
  <path class="l" d="M200 138 H220 V98"/>
  <path class="l" d="M410 98 H448"/>
  <path class="l" d="M545 138 V168"/>
  <path class="l" d="M200 138 H230 V198 H448"/>
  <path class="l" d="M200 218 H430 V214 H448"/>
  <path class="l" d="M640 198 H665 V42 H688"/>
  <path class="l" d="M665 96 H688"/>
  <path class="l" d="M665 150 H688"/>
  <path class="l" d="M665 204 H688"/>
  <path class="l" d="M665 204 V258 H688"/>
  <path class="l" d="M825 280 V290 H642"/>
</svg>
